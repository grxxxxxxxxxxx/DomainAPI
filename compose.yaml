version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: domain_container
    environment:
      POSTGRES_DB: booking_database
      POSTGRES_USER: grxxx
      POSTGRES_PASSWORD: Grxxxerror402
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - booking-network 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grxxx -d booking_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  bookingproject:
    image: bookingproject:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=booking_database;Username=grxxx;Password=Grxxxerror402
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - booking-network

  tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: booking_tests
    working_dir: /app
    volumes:
      - ./DomainsTests:/app
    environment:
      - ASPNETCORE_ENVIRONMENT=Test
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=booking_database;Username=grxxx;Password=Grxxxerror402
    depends_on:
      postgres:
        condition: service_healthy
      bookingproject:
        condition: service_started
    networks:
      - booking-network
    command: ["dotnet", "test", "--logger:trx"]

networks:
  booking-network:
    driver: bridge

volumes:
  postgres_data: